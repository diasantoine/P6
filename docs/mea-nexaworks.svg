size="14" lengthAdjust="spacing" textLength="120.2168" x="69.5" y="715.5801">+CreatedAt : DATE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="163.7959" x="69.5" y="733.1895">+ResolvedAt : DATE [0..1]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.2031" x="69.5" y="750.7988">+Problem : NVARCHAR(MAX)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="239.2441" x="69.5" y="768.4082">+Resolution : NVARCHAR(MAX) [0..1]</text><line style="stroke:#181818;stroke-width:0.5;" x1="64.5" x2="321.5508" y1="775.4844" y2="775.4844"/></g><!--class Status--><g class="entity" data-qualified-name="Status" data-source-line="45" id="ent0006"><rect fill="#F1F1F1" height="78.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="231.0645" x="77.5" y="432.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="173.1875" y="451.6426">Status</text><line style="stroke:#181818;stroke-width:0.5;" x1="78.5" x2="307.5645" y1="459.7188" y2="459.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.21" x="83.5" y="478.252">+Id : INT &#171;PK&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.0645" x="83.5" y="495.8613">+Label : NVARCHAR(20) &#171;unique&#187;</text><line style="stroke:#181818;stroke-width:0.5;" x1="78.5" x2="307.5645" y1="502.9375" y2="502.9375"/></g><g class="entity" data-qualified-name="GMN12" data-source-line="57" id="ent0013"><path d="M403,654.1094 L403,745.8672 A0,0 0 0 0 403,745.8672 L753.4688,745.8672 A0,0 0 0 0 753.4688,745.8672 L753.4688,664.1094 L743.4688,654.1094 L575.79,654.1094 L554.7,528.8894 L567.79,654.1094 L403,654.1094 A0,0 0 0 0 403,654.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M743.4688,654.1094 L743.4688,664.1094 L753.4688,664.1094 L743.4688,654.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.4688" x="409" y="672.6045">Join table Version &lt;-&gt; OperatingSystem (many-to-many).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.3896" x="409" y="688.9561">One row = one supported combination.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.3306" x="409" y="705.3076">A ticket points to an existing Version + OS pair:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.9541" x="409" y="721.6592">a ticket on an unsupported combination is impossible</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.9834" x="409" y="738.0107">(e.g. Trader en Herbe 1.0 on iOS).</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="65" id="ent0016"><path d="M6,854.6094 L6,913.6641 A0,0 0 0 0 6,913.6641 L380.2026,913.6641 A0,0 0 0 0 380.2026,913.6641 L380.2026,864.6094 L370.2026,854.6094 L197,854.6094 L193,783.8594 L189,854.6094 L6,854.6094 A0,0 0 0 0 6,854.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M370.2026,854.6094 L370.2026,864.6094 L380.2026,864.6094 L370.2026,854.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.7026" x="12" y="873.1045">Status "Resolved"    =&gt; ResolvedAt and Resolution are filled</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.2026" x="12" y="889.4561">Status "In progress" =&gt; ResolvedAt and Resolution are NULL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.418" x="12" y="905.8076">ResolvedAt &gt;= CreatedAt</text></g><!--link Product to Version--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="association" data-source-line="50" id="lnk7"><path codeLine="50" d="M547,124.8094 C547,150.2394 547,183.9194 547,212.2894" fill="none" id="Product-Version" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.96" x="548" y="174.1045">has</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.23" x="539.4653" y="145.9484">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="19.5127" x="526.8674" y="201.8422">1..*</text></g><!--link Version to VersionOperatingSystem--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="association" data-source-line="51" id="lnk8"><path codeLine="51" d="M547,326.8494 C547,354.2394 547,387.0694 547,414.4394" fill="none" id="Version-VersionOperatingSystem" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="43.3608" x="548" y="376.1045">runs on</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.23" x="539.5814" y="348.3142">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="19.5127" x="526.8148" y="403.6041">1..*</text></g><!--link VersionOperatingSystem to OperatingSystem--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="association" data-source-line="52" id="lnk9"><path codeLine="52" d="M674.22,471.6094 C716.49,471.6094 763.33,471.6094 804.81,471.6094" fill="none" id="VersionOperatingSystem-OperatingSystem" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust=